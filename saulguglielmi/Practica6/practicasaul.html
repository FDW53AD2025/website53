<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Flexbox</title>
    <link rel="stylesheet" href="stylezzz.css">
</head>
<body>
    <div class="flex-container">
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg" alt="React Logo">
            <span class="title">React</span>
        </div>
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Vue.js_Logo_2.svg/1200px-Vue.js_Logo_2.svg.png" alt="Vue Logo">
            <span class="title">Vue</span>
        </div>
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Tailwind_CSS_Logo.svg/2560px-Tailwind_CSS_Logo.svg.png" alt="Tailwind Logo">
            <span class="title">Tailwind</span>
        </div>
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/96/Sass_Logo_Color.svg" alt="Sass Logo">
            <span class="title">Sass</span>
        </div>
        <div class="item">
            <img src="https://gsap.com/community/uploads/monthly_2020_03/tweenmax.png.cf27916e926fbb328ff214f66b4c8429.png" alt="GSAP Logo">
            <span class="title">GSAP</span>
        </div>
    </div>
</body>
</html>
