<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores de Comparación</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .container {
            border: 1px solid #ccc;
            padding: 20px 40px;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-top: 0;
        }
        label, input, select, button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultado {
            font-weight: bold;
            background-color: #e9ecef;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Aplicación operadores de comparación</h2>

        <label for="numero1">Numero 1:</label>
        <input type="number" id="numero1" value="0">

        <label for="numero2">Numero 2:</label>
        <input type="number" id="numero2" value="0">

        <label for="operador">Operador de comparación:</label>
        <select id="operador">
            <option value=">"> > (Mayor que)</option>
            <option value="<"> < (Menor que)</option>
            <option value=">=">>= (Mayor o igual que)</option>
            <option value="<="><= (Menor o igual que)</option>
            <option value="==">== (Igual a)</option>
            <option value="!=">!= (Distinto de)</option>
        </select>

        <label for="resultado">Resultado:</label>
        <input type="text" id="resultado" readonly>

        <button onclick="calcular()">Calcular</button>
    </div>

    <script>
        function calcular() {
            // 1. Obtener los valores de los inputs y el operador
            const num1 = parseFloat(document.getElementById('numero1').value);
            const num2 = parseFloat(document.getElementById('numero2').value);
            const operador = document.getElementById('operador').value;
            
            // Variable para almacenar el resultado booleano (true/false)
            let resultadoBooleano;

            // 2. Realizar la comparación según el operador seleccionado
            switch (operador) {
                case '>':
                    resultadoBooleano = num1 > num2;
                    break;
                case '<':
                    resultadoBooleano = num1 < num2;
                    break;
                case '>=':
                    resultadoBooleano = num1 >= num2;
                    break;
                case '<=':
                    resultadoBooleano = num1 <= num2;
                    break;
                case '==':
                    resultadoBooleano = num1 == num2;
                    break;
                case '!=':
                    resultadoBooleano = num1 != num2;
                    break;
                default:
                    resultadoBooleano = "Operador no válido";
            }

            // 3. Mostrar el resultado en el campo "Resultado"
            document.getElementById('resultado').value = resultadoBooleano;
        }
    </script>

</body>
</html>
