<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flexbox</title>
  <link rel="stylesheet" href="./estilos.css">
</head>
<body>
  <main>
    <section class="contenedor_de_cajas">
      <article class="caja">
        <figure class="figura">
          <img src="REACT.png" alt="Logo de React">
          <figcaption><h2>Caja 1</h2></figcaption>
        </figure>
      </article>

      <article class="caja">
        <figure class="figura">
          <img src="VUE.png" alt="Logo de Vue.js">
          <figcaption><h2>Caja 2</h2></figcaption>
        </figure>
      </article>

      <article class="caja">
        <figure class="figura">
          <img src="TAILWIND.png" alt="Logo de TailwindCSS">
          <figcaption><h2>Caja 3</h2></figcaption>
        </figure>
      </article>

      <article class="caja">
        <figure class="figura">
          <img src="SASS.png" alt="Logo de Sass">
          <figcaption><h2>Caja 4</h2></figcaption>
        </figure>
      </article>

      <article class="caja">
        <figure class="figura">
          <img src="CAPA.png" alt="Logo de GSAP">
          <figcaption><h2>Caja 5</h2></figcaption>
        </figure>
      </article>
    </section>
  </main>
</body>
</html>
