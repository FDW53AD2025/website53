<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Operadores de comparación</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Aplicación sueldo empleados</h1>
    <form action="">
        <label for="numeroUno">Numero 1:</label>
        <input type="text" name="numeroUno" id="numeroUno">

        <label for="numeroDos">Numero 2:</label>
        <input type="text" name="numeroDos" id="numeroDos">

        <label for="operador">Operador:</label>
        <select name="operadorr" id="operadorr" multiple>
            <option value="1"> < </option>
            <option value="2"> <= </option>
            option value="2"> > </option>
            <option value="3"> >= </option>
            <option value="4"> == </option>
            <option value="5"> != </option>
         </select>   

    
        <label for="resultado">Resultado:</label>
        <input type="text" name="resultado" id="resultado">

        <button id="calcular">Calcular</button>
    </form>


  <script src="main.js"></script>
</body>
</html>
