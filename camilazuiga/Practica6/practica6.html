<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Tecnologías</title>
    <link rel="stylesheet" href="estiloPractica.css">
</head>
<body>
    <section class="galeria">
        <h2>Tecnologías Frontend Populares</h2>
        <ul class="lista-tarjetas">
            <li class="item-tarjeta">
                <figure>
                    <img src="img/logoVue.png" alt="Vue">
                    <figcaption>Vue</figcaption>
                </figure>
            </li>
            <li class="item-tarjeta">
                <figure>
                    <img src="img/LogoReact.png" alt="React">
                    <figcaption>React</figcaption>
                </figure>
            </li>
            <li class="item-tarjeta">
                <figure>
                    <img src="img/logoTailwind.png" alt="Tailwind">
                    <figcaption>Tailwind</figcaption>
                </figure>
            </li>
            <li class="item-tarjeta">
                <figure>
                    <img src="img/logoGSAP.png" alt="GSAP">
                    <figcaption>GSAP</figcaption>
                </figure>
            </li>
            <li class="item-tarjeta">
                <figure>
                    <img src="img/logoSass.png" alt="Sass">
                    <figcaption>Sass</figcaption>
                </figure>
            </li>
        </ul>
    </section>
</body>
</html>
