<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de selectores</title>
    <style>
      section { border: 5px solid black; background-color: antiquewhite; text-align: center; margin-bottom: 3rem; 
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      }
      
      h1 + img { width: 750px; height: 200px; padding-right: 25px; padding-bottom: 12%;}
      img + img { width: 800px; height: 600px; padding-right: 25px; padding-bottom: 25px;}

    </style>

</head>
<body>
 <section>

 </section>
