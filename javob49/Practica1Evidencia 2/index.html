<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicacion Operadores de Comparación</title>
    <Link rel="Stylesheet" href="estilos.css">


</head>
<body>
    <h1>Operadores de Comparación</h1>    
    <form action="">
        <label for="num1">Numero uno:</label>
        <input type="text" name="num1" id="num1">

        <label for="num2">Numero dos:</label>
        <input type="text" name="num2" id="num2">

        <label for="operador">operador:</label>
        <Select name="operador" id="operador">
            <option value="1">&gt; (Menor)</option>
            <option value="2">&gt; (Menor o igual)</option>
            <option value="3">&gt; (Mayor)</option>
            <option value="4">&gt; (Mayor o igual)</option>
            <option value="5">(igual)</option>
            <option value="6">!= (Distinto de)</option>
         </Select>

        <label for="Resultado">Resultado:</label>
        <input type="text" name="Resultado" id="Resultado">

        <button id="boton">Hacer comparacion</button>

    </form>
    <script src="main.js"></script>

    
</body>
</html>
