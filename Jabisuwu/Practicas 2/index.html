<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación de Operadores</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Aplicación de Operadores</h1>
    <form action="">
        <label for="Uno">Número 1:</label>
        <input type="text" name="Uno" id="Uno">

        <label for="Dos">Número 2:</label>
        <input type="text" name="Dos" id="Dos">

        <label for="Operador">Operador de comparación:</label>
        <select name="Operador" id="Operador">
            <option value="1">Igual que</option>
            <option value="2">Diferente de</option>
            <option value="3">Mayor que</option>
            <option value="4">Menor que</option>
            <option value="5">Mayor o igual que</option>
            <option value="6">Menor o igual que</option>
        </select>

        <label for="Resultado">Resultado:</label>
        <input type="text" name="Resultado" id="Resultado">

        <button id="Calcular">Calcular</button>
        
    </form>
    <script src="main.js"></script>
</body>
</html>
