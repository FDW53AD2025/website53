<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./estilos.css">
  <title>Flexbox</title>
</head>
<body>
  <main>
    <section class="contenedor_de_cajas">
      <article class="cajita">
        <figure class="figura">
          <img src="React.png" alt="Logo de React">
          <figcaption><h2>React</h2></figcaption>
        </figure>
      </article>

      <article class="cajita roja">
        <figure class="figura">
          <img src="V.png" alt="Logo de Vue.js">
          <figcaption><h2>Vue</h2></figcaption>
        </figure>
      </article>

      <article class="cajita roja">
        <figure class="figura">
          <img src="T.png" alt="Logo de TailwindCSS">
          <figcaption><h2>TailwindCSS</h2></figcaption>
        </figure>
      </article>

      <article class="cajita azul">
        <figure class="figura">
          <img src="Sass.png" alt="Logo de Sass">
          <figcaption><h2>Sass</h2></figcaption>
        </figure>
      </article>

      <article class="cajita verde">
        <figure class="figura">
          <img src="GSAP.png" alt="Logo de GSAP">
          <figcaption><h2>GSAP</h2></figcaption>
        </figure>
      </article>
    </section>
  </main>
</body>
</html>
