<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicacion de Operadores</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Aplicacion Operadores</h1>
    <form action="">
        <label for="num1">Numero uno:</label>
        <input type="text" name="num1" id="num1">

        <label for="num2">Numero dos:</label>
        <input type="text" name="num2" id="num2">

        <label for="operador">Operador:</label> 
        <select name="operador" id="operador" multiple>
            <option value="1">Mayor que</option>
            <option value="2">Mayor o igual que</option>
            <option value="3">Menor que</option>
            <option value="4">Menor o igual que</option>
            <option value="5">==</option>
            <option value="6">!=</option>
        </select>

        <label for="resultado">resultado:</label>
        <input type="text" name="resultado" id="resultado">

        <button id="boton">Calcular</button>
    </form>
    <script src="main.js"></script>

    <footer>
        <p>&copy; Esta actividad fue realizada en clase - Fundamentos de Desarrollo Web</p>
    </footer>
</body>
</html>
