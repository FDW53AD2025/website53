<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 1. Evidencia 2</title>
    <link rel="stylesheet" href="estilospractica1.css">
</head>
<body>
    <h1>Aplicacion Operadores</h1>

    <form action="">
        <label for="num1">Numero Uno: </label>
        <input type="text" name="num1" id="num1">

        <label for="num2">Numero Dos: </label>
        <input type="text" name="num2" id="num2">

        <label for="operador">Operador: </label>
        <select name="operador" id="operador" multiple>
            <option value="1">Mayor</option>
            <option value="2">Mayor igual</option>
            <option value="3">Menor</option>
            <option value="4">Menor igual</option>
            <option value="5">Igual </option>
            <option value="6">Diferente</option>
        </select>

        <label for="resultado">Resultado: </label>
        <input type="text" name="resultado" id="resultado">

        <button id="calcular">Calcular</button>
    </form>
    <script src="practica1.js"></script>
</body>
</html>
