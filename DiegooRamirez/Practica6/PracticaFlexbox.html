<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    body {
        background-color: rgb(0, 0, 0);
        margin: 150px;
    }

    .contenedor {
        display: flex;
        justify-content: space-evenly;
    }    

    .contenedor>div{
        width: 200px;
        height: 250px;
        color: rgb(125, 223, 240);
        background-color: rgb(70, 69, 69);
        border-radius: 5px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        padding-bottom: 10px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    img {
        width: 100px;
        height: 100px;
    }
    
</style>
</head>
<body>
    <section class="contenedor">
        <div><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/React-icon.svg/512px-React-icon.svg.png?20220125121207" alt=""><h1>React</h1></div>
        <div><img src="https://upload.wikimedia.org/wikipedia/commons/f/f1/Vue.png?20170311074507" alt=""><h1>Vue</h1></div>
        <div><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Tailwind_CSS_Logo.svg/512px-Tailwind_CSS_Logo.svg.png" alt=""><h1>Tailwind</h1></div>
        <div><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Sass_Logo_Color.svg/512px-Sass_Logo_Color.svg.png" alt=""><h1>Sass</h1></div>
        <div><img src="https://gsap.com/community/uploads/monthly_2020_03/tweenmax.thumb.png.c849c5b56c6752e3f2276b82ee702625.png" alt=""><h1>GSAP</h1></div>
    </section>
</body>
</html>
