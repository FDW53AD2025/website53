<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 6: Flexbox</title>
    <link rel="stylesheet" href="practica6.css">
</head>

<body>

    <header>
        <h1>Práctica 6</h1>
        <p>Utilizando flexbox, cree un documento HTML donde se diseñe lo que se muestra en la imagen siguiente.</p>
    </header>

    <div class="flex-container">
        <div class="flex-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg" alt="React Logo">
            <p>React</p>
        </div>
        <div class="flex-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Vue.js_Logo_2.svg" alt="Vue Logo">
            <p>Vue</p>
        </div>
        <div class="flex-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d5/Tailwind_CSS_Logo.svg" alt="Tailwind Logo">
            <p>Tailwind</p>
        </div>
        <div class="flex-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/96/Sass_Logo_Color.svg" alt="Sass Logo">
            <p>Sass</p>
        </div>
        <div class="flex-item">
            <img src="GSAP.png"
                alt="GSAP Logo">
            <p>GSAP</p>
        </div>
    </div>

</body>

</html>
